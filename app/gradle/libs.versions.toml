[versions]
activityKtxVersion = "1.13.0"
androidsvgAar = "1.4"
commonsIoVersion = "1.3.2"
commonsTextVersion = "1.15.0"
constraintlayoutVersion = "2.2.1"
httpclientVersion = "4.5.14"
coreKtx = "1.19.0"
appcompat = "1.7.1"
lifecycleRuntimeKtxVersion = "2.11.0"
material = "1.14.0"
webkitVersion = "1.16.0"
ktorClient = "3.5.1"
kotlinxCoroutines = "1.11.0"
androidsuspendutils = "1.4.0"

[libraries]
activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "activityKtxVersion" }
androidsvg-aar = { module = "com.caverock:androidsvg-aar", version.ref = "androidsvgAar" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayoutVersion" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtxVersion" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "webkitVersion" }
commons-io = { module = "org.apache.commons:commons-io", version.ref = "commonsIoVersion" }
commons-text = { module = "org.apache.commons:commons-text", version.ref = "commonsTextVersion" }
httpclient = { module = "org.apache.httpcomponents:httpclient", version.ref = "httpclientVersion" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktorClient" }
ktor-client-android = { module = "io.ktor:ktor-client-android", version.ref = "ktorClient" }
kotlinx-coroutines = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
androidsuspendutils = { module = "com.github.gustavlindberg99:androidsuspendutils", version.ref = "androidsuspendutils" }