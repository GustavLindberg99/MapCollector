<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width"/>
    <meta name="application-name" content="Map Collector"/>
    <meta name="author" content="Gustav Lindberg"/>

    <!-- Peer.js (library for communicating with the opponent in multiplayer games) -->
    <script type="text/javascript" src="libs/peerjs.min.js"></script>

    <!-- Tippy.js (library for showing bubbles). The CSS is Map Collector's own customization of the tippy bubble. -->
    <script type="text/javascript" src="libs/popper.min.js"></script>
    <script type="text/javascript" src="libs/tippy-bundle.umd.min.js"></script>
    <link rel="stylesheet" type="text/css" href="static/css/tippy.css"/>

    <!-- In the app, don't use the actual Xdialog and Toastify libraries, but rather functions with the same signature but that integrate with native Android features. These are implemented in plain JavaScript in order not to confuse the TypeScript compiler. -->
    <script type="text/javascript" src="static/js/native-lib-implementations/xdialog-android.js"></script>
    <script type="text/javascript" src="static/js/native-lib-implementations/toastify-android.js"></script>

    <!-- Svg-pan-zoom (library allowing to pan and zoom the mapsheet) -->
    <script type="text/javascript" src="libs/svg-pan-zoom.min.js"></script>

    <!-- Game -->
    <script type="module" src="static/js/game/main.js"></script>
    <link rel="stylesheet" type="text/css" href="static/css/game/main.css"/>
    <link rel="stylesheet" type="text/css" href="static/css/toolbar.css"/>
    <link rel="stylesheet" type="text/css" href="static/css/zoom-box.css"/>

    <!-- General -->
    <link rel="stylesheet" type="text/css" href="static/css/general/main.css"/>
    <link rel="stylesheet" type="text/css" href="static/css/app.css"/>
</head>
<body>
    <section role="application"></section>
</body>
</html>
